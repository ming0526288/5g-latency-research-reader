<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">5G 架构：UE、接入网、核心网与数据网络应用</title>
  <desc id="desc">依据 TS 23.501 V20.3.0 图 4.2.3-2 和第 4.2.7 节简化重绘。蓝线表示用户面路径，N3 连接接入网与 UPF，N6 连接 UPF 与数据网络 DN。灰色虚线表示保留的控制关系；AMF、SMF 与 UPF 均为核心网功能，业务应用画在数据网络一端。省略其他功能和参考点，不代表实际部署或测量结果。</desc>
  <defs>
    <marker id="blue-end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8Z" fill="#17699a"/></marker>
  </defs>
  <rect width="1440" height="640" rx="22" fill="#f5f8fc"/>
  <g font-family="Arial, Noto Sans CJK SC, sans-serif" fill="#183146">
    <text x="34" y="48" font-size="30" font-weight="700">先看业务包走哪条线，再看各部分属于谁</text>
    <text x="34" y="82" font-size="21" fill="#526575">逻辑架构简图 · 只保留本页相关功能与参考点，不按距离或时延比例绘制</text>

    <rect x="30" y="128" width="260" height="365" rx="18" fill="#edf3ff" stroke="#b5c9e9" stroke-width="2"/>
    <text x="160" y="165" text-anchor="middle" font-size="24" font-weight="700">UE 终端</text>
    <rect x="58" y="205" width="204" height="82" rx="12" fill="#fff" stroke="#9eb8e0"/>
    <text x="160" y="239" text-anchor="middle" font-size="23">终端侧应用</text>
    <text x="160" y="269" text-anchor="middle" font-size="18" fill="#526575">生成 / 读取业务数据</text>
    <path d="M160 296 V341" fill="none" stroke="#17699a" stroke-width="3" marker-start="url(#blue-end)" marker-end="url(#blue-end)"/>
    <rect x="58" y="352" width="204" height="95" rx="12" fill="#fff" stroke="#9eb8e0"/>
    <text x="160" y="390" text-anchor="middle" font-size="23">UE 通信处理</text>
    <text x="160" y="422" text-anchor="middle" font-size="18" fill="#526575">与上面的应用同属终端侧</text>

    <rect x="345" y="128" width="235" height="365" rx="18" fill="#eef7f4" stroke="#b4d7ca" stroke-width="2"/>
    <text x="462" y="165" text-anchor="middle" font-size="24" font-weight="700">接入网 (R)AN</text>
    <text x="462" y="194" text-anchor="middle" font-size="18" fill="#526575">本场景为 NG-RAN</text>
    <rect x="367" y="352" width="191" height="95" rx="12" fill="#fff" stroke="#a0c8b8"/>
    <text x="462" y="390" text-anchor="middle" font-size="25" font-weight="700">gNB</text>
    <text x="462" y="422" text-anchor="middle" font-size="20" fill="#526575">5G 基站</text>

    <rect x="640" y="112" width="395" height="381" rx="18" fill="#fff5df" stroke="#d7bb7c" stroke-width="2"/>
    <text x="837" y="150" text-anchor="middle" font-size="24" font-weight="700">核心网 5GC</text>
    <text x="837" y="179" text-anchor="middle" font-size="18" fill="#526575">图中仅保留部分核心网功能</text>
    <rect x="665" y="208" width="150" height="63" rx="11" fill="#fff" stroke="#c8b685"/>
    <text x="740" y="248" text-anchor="middle" font-size="24" font-weight="700">AMF</text>
    <rect x="860" y="208" width="150" height="63" rx="11" fill="#fff" stroke="#c8b685"/>
    <text x="935" y="248" text-anchor="middle" font-size="24" font-weight="700">SMF</text>
    <rect x="740" y="352" width="195" height="95" rx="12" fill="#fff" stroke="#c8b685" stroke-width="2"/>
    <text x="837" y="390" text-anchor="middle" font-size="25" font-weight="700">UPF</text>
    <text x="837" y="422" text-anchor="middle" font-size="20" fill="#526575">用户面转发功能</text>

    <rect x="1120" y="128" width="290" height="365" rx="18" fill="#f2eefb" stroke="#c9b9e4" stroke-width="2"/>
    <text x="1265" y="165" text-anchor="middle" font-size="24" font-weight="700">数据网络 DN</text>
    <text x="1265" y="210" text-anchor="middle" font-size="21">可为工厂本地网络</text>
    <text x="1265" y="241" text-anchor="middle" font-size="19" fill="#526575">不等于必须经过公网互联网</text>
    <rect x="1152" y="352" width="226" height="95" rx="12" fill="#fff" stroke="#b5a3d1"/>
    <text x="1265" y="390" text-anchor="middle" font-size="23">网络侧业务应用</text>
    <text x="1265" y="422" text-anchor="middle" font-size="19" fill="#526575">工厂接收 / 分析 / 控制程序</text>

    <g fill="none" stroke="#73818c" stroke-width="2.5" stroke-dasharray="7 6">
      <path d="M462 352 V239 H665"/>
      <path d="M815 239 H860"/>
      <path d="M935 271 V311 H837 V352"/>
    </g>
    <g font-size="20" fill="#526575">
      <text x="595" y="226">N2</text>
      <text x="837" y="224" text-anchor="middle" font-size="17">N11</text>
      <text x="882" y="301">N4</text>
    </g>
    <g stroke="#17699a" stroke-width="3.5" fill="none" marker-start="url(#blue-end)" marker-end="url(#blue-end)">
      <path d="M272 399 H357"/>
      <path d="M569 399 H730"/>
      <path d="M946 399 H1141"/>
    </g>
    <text x="315" y="379" text-anchor="middle" font-size="19" fill="#17699a">无线链路</text>
    <text x="650" y="381" text-anchor="middle" font-size="24" fill="#17699a" font-weight="700">N3</text>
    <text x="1044" y="381" text-anchor="middle" font-size="24" fill="#17699a" font-weight="700">N6</text>
    <text x="650" y="474" text-anchor="middle" font-size="18" fill="#17699a">接入网 ↔ UPF</text>
    <text x="1044" y="474" text-anchor="middle" font-size="18" fill="#17699a">UPF ↔ DN</text>

    <path d="M35 533 H88" stroke="#17699a" stroke-width="3.5"/>
    <text x="100" y="540" font-size="21">业务数据：上行向右，下行向左</text>
    <path d="M660 533 H713" stroke="#73818c" stroke-width="2.5" stroke-dasharray="7 6"/>
    <text x="725" y="540" font-size="21">灰色虚线：控制关系，不是业务包逐包路线</text>
    <text x="35" y="583" font-size="20">N3 / N6 是参考点名称；“端点”指连线两端的功能实体，不是 UDP 端口号。</text>
    <text x="35" y="616" font-size="18" fill="#526575">依据 TS 23.501 V20.3.0 图 4.2.3-2、§4.2.7；应用框为教学补充，非协议原图或本次实测拓扑。</text>
  </g>
</svg>
