<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
<title id="title">先确定时延测到了哪里</title><desc id="desc">应用边界示意；不等于纯空口，也不等于每层 CPU 耗时。 教学示意，不是新增实验结果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d59"/></marker></defs>
<rect width="1000" height="410" rx="16" fill="#f5faf7"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif"><text x="35" y="48" font-size="29" fill="#24443b" text-anchor="start">先确定时延测到了哪里</text><text x="35" y="82" font-size="18" fill="#24443b" text-anchor="start">应用边界示意；不等于纯空口，也不等于每层 CPU 耗时。</text><rect x="60" y="145" width="230" height="90" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="175.0" y="197.33333333333334" font-size="22" fill="#24443b" text-anchor="middle">UE 应用</text><rect x="385" y="145" width="230" height="90" rx="7" fill="#f6e7bf" stroke="#b8d1c2"/><text x="500.0" y="197.33333333333334" font-size="22" fill="#24443b" text-anchor="middle">UPF 侧应用</text><rect x="710" y="145" width="230" height="90" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="825.0" y="197.33333333333334" font-size="22" fill="#24443b" text-anchor="middle">UE 应用</text><path d="M290 190 L380 190" stroke="#256d59" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M615 190 L705 190" stroke="#256d59" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="175" y="280" font-size="20" fill="#24443b" text-anchor="middle">t₀：发送</text><text x="500" y="280" font-size="20" fill="#24443b" text-anchor="middle">t₁：接收 / t₂：回复</text><text x="825" y="280" font-size="20" fill="#24443b" text-anchor="middle">t₃：收到回复</text><text x="335" y="135" font-size="20" fill="#24443b" text-anchor="middle">上行 UL</text><text x="665" y="135" font-size="20" fill="#24443b" text-anchor="middle">下行 DL</text><text x="500" y="340" font-size="23" fill="#24443b" text-anchor="middle">同一事务：闭环 = 上行 + 回复处理 + 下行</text><text x="35" y="385" font-size="16" fill="#24443b" text-anchor="start">教学示意，不是新增实验结果。</text></g></svg>