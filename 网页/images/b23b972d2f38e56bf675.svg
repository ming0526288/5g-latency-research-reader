<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2277b6"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#209e89"/></marker></defs><rect width="1000" height="380" rx="14" fill="#f5f8fc"/><g font-family="Arial, Microsoft YaHei, sans-serif" fill="#20334c"><text x="35" y="36" font-size="22">本次实际通信路径与四个应用时间戳</text><rect x="50" y="68" width="220" height="246" rx="12" fill="#e3effa"/><rect x="388" y="68" width="190" height="246" rx="12" fill="#edf0f7"/><rect x="700" y="68" width="245" height="246" rx="12" fill="#e0f4ee"/><text x="160" y="100" text-anchor="middle" font-size="20">UE 应用 / TUN</text><text x="483" y="100" text-anchor="middle" font-size="20">gNB · RFsim</text><text x="822" y="100" text-anchor="middle" font-size="20">UPF 侧应用</text><path d="M260 148H705" stroke="#2277b6" stroke-width="4" marker-end="url(#a)"/><text x="480" y="136" text-anchor="middle" font-size="15">同一事务的 UDP 请求 · 上行</text><path d="M708 246H263" stroke="#209e89" stroke-width="4" marker-end="url(#b)"/><text x="480" y="273" text-anchor="middle" font-size="15">携带原事务编号的响应 · 下行</text><text x="70" y="143" font-size="16">t0：构造请求前</text><text x="718" y="143" font-size="16">t1：收到请求后</text><text x="718" y="242" font-size="16">t2：构造响应前</text><text x="70" y="242" font-size="16">t3：收到响应后</text><text x="822" y="193" text-anchor="middle" font-size="15">reply = t2 − t1</text><text x="50" y="344" font-size="17">RTT = t3 − t0 = UL + reply + DL；主计时使用同机单调时钟</text><text x="50" y="368" font-size="13">路径示意不按耗时比例绘制；未包含相机处理、机械臂执行或外部 DN 物理链路。</text></g></svg>