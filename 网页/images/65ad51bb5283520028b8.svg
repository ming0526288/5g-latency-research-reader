<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">1200 B 应用数据怎样加上 UDP 与 IPv4 头部</title>
  <desc id="desc">教学示意，不按字节比例绘制。无选项、无分片时，IPv4 头20字节，UDP头8字节，应用数据1200字节，共1228字节。应用数据内含实验测量标记32字节和填充1168字节。</desc>
  <rect width="1040" height="500" rx="18" fill="#f5f8fc"/>
  <g font-family="Arial, 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#17324d">
    <text x="40" y="46" font-size="25" font-weight="700">同一份数据，从不同层看，长度不一样</text>
    <text x="40" y="78" font-size="16" fill="#52677e">普通 UDP + IPv4 无选项、无 IP 分片；图形不按字节比例绘制</text>
    <rect x="40" y="116" width="188" height="122" rx="12" fill="#dceafc" stroke="#6292c7"/>
    <rect x="244" y="116" width="188" height="122" rx="12" fill="#e0f3ed" stroke="#54a390"/>
    <rect x="448" y="116" width="552" height="122" rx="12" fill="#fff0d5" stroke="#d4a048"/>
    <text x="134" y="153" text-anchor="middle" font-size="21" font-weight="700">IPv4 头部</text>
    <text x="134" y="187" text-anchor="middle" font-size="22">20 B</text>
    <text x="134" y="216" text-anchor="middle" font-size="16">源、目的 IP 地址等</text>
    <text x="338" y="153" text-anchor="middle" font-size="21" font-weight="700">UDP 头部</text>
    <text x="338" y="187" text-anchor="middle" font-size="22">8 B</text>
    <text x="338" y="216" text-anchor="middle" font-size="16">端口、长度、校验和</text>
    <text x="724" y="153" text-anchor="middle" font-size="21" font-weight="700">应用交给 UDP 的数据</text>
    <text x="724" y="187" text-anchor="middle" font-size="22">1200 B</text>
    <text x="724" y="216" text-anchor="middle" font-size="16">实验的包长、应用 Mbps 按这里记账</text>
    <path d="M244 254v13h756v-13 M40 293v13h960v-13" fill="none" stroke="#52677e" stroke-width="2"/>
    <text x="622" y="290" text-anchor="middle" font-size="17">UDP 数据报：8 + 1200 = 1208 B</text>
    <text x="520" y="332" text-anchor="middle" font-size="17">IPv4 数据报：20 + 8 + 1200 = 1228 B</text>
    <rect x="448" y="357" width="214" height="74" rx="10" fill="#ffe2b0" stroke="#d4a048"/>
    <rect x="674" y="357" width="326" height="74" rx="10" fill="#fff7e8" stroke="#d4a048"/>
    <text x="555" y="386" text-anchor="middle" font-size="17">实验编号、时间戳</text>
    <text x="555" y="414" text-anchor="middle" font-size="19">32 B（已含）</text>
    <text x="837" y="386" text-anchor="middle" font-size="17">本探针的填充数据</text>
    <text x="837" y="414" text-anchor="middle" font-size="19">1168 B</text>
    <text x="40" y="470" font-size="17" fill="#52677e">1228 B 还不是整个 5G 链路的全部开销；这里没有统计隧道、链路和无线层开销。</text>
  </g>
</svg>
