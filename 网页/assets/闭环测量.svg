<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc"><title id="title">同一事务的四个应用时间戳</title><desc id="desc">UE发请求前t0、服务端收到后t1、回复前t2、UE收到后t3。上行为t1减t0，处理为t2减t1，下行为t3减t2。</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#587b65" stroke-width="1.3"/></marker></defs><rect width="900" height="330" rx="12" fill="#f9fbf8"/><g font-family="Arial,Microsoft YaHei,sans-serif" text-anchor="middle"><text x="450" y="35" fill="#526b59" font-size="15">同一事务 · 四个应用时刻 · 三个实测区间</text><path d="M90 157H808" stroke="#b0c5b3" stroke-width="2" marker-end="url(#arr)"/><g font-size="14" fill="#294b39"><text x="95" y="95">UE发请求前</text><text x="335" y="95">服务端收到后</text><text x="535" y="95">回复前</text><text x="790" y="95">UE收到后</text></g><g font-size="21" fill="#30654b"><text x="95" y="130">t₀</text><text x="335" y="130">t₁</text><text x="535" y="130">t₂</text><text x="790" y="130">t₃</text></g><g fill="#30654b"><circle cx="95" cy="157" r="6"/><circle cx="335" cy="157" r="6"/><circle cx="535" cy="157" r="6"/><circle cx="790" cy="157" r="6"/></g><rect x="110" y="182" width="210" height="55" rx="7" fill="#e7f0e7"/><rect x="350" y="182" width="170" height="55" rx="7" fill="#f3edde"/><rect x="550" y="182" width="225" height="55" rx="7" fill="#e6edf1"/><g fill="#35573f" font-size="14"><text x="215" y="204">上行 UL</text><text x="215" y="224">t₁ − t₀</text><text x="435" y="204">实测回显处理</text><text x="435" y="224">t₂ − t₁</text><text x="660" y="204">下行 DL</text><text x="660" y="224">t₃ − t₂</text></g><path d="M95 263v12h695v-12" stroke="#94ad99" fill="none"/><text x="450" y="302" fill="#52715c" font-size="14">通信应用闭环 = t₃ − t₀</text></g></svg>
