<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 465" role="img" aria-labelledby="title desc">
<title id="title">UE 数量变了，负载怎样保持可比</title><desc id="desc">这里表示业务生成速率，不是调度器实际分配的无线资源。 等分总业务量是实验设定，不代表协议保证每 UE 得到相同吞吐。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d59"/></marker></defs>
<rect width="1000" height="465" rx="16" fill="#f5faf7"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif"><text x="35" y="48" font-size="29" fill="#24443b" text-anchor="start">UE 数量变了，负载怎样保持可比</text><text x="35" y="82" font-size="18" fill="#24443b" text-anchor="start">这里表示业务生成速率，不是调度器实际分配的无线资源。</text><text x="60" y="135" font-size="23" fill="#24443b" text-anchor="start">固定每 UE 负载：每条业务 2 Mbps</text><text x="555" y="135" font-size="23" fill="#24443b" text-anchor="start">固定总负载：总计 8 Mbps</text><text x="65" y="200" font-size="21" fill="#24443b" text-anchor="start">1 UE → 总计 2 Mbps</text><rect x="340" y="175" width="140" height="37" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="410.0" y="199.5" font-size="18" fill="#24443b" text-anchor="middle">2 Mbps</text><text x="560" y="200" font-size="21" fill="#24443b" text-anchor="start">1 UE → 每 UE 8 Mbps</text><text x="65" y="257" font-size="21" fill="#24443b" text-anchor="start">2 UE → 总计 4 Mbps</text><rect x="340" y="232" width="140" height="37" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="410.0" y="256.5" font-size="18" fill="#24443b" text-anchor="middle">4 Mbps</text><text x="560" y="257" font-size="21" fill="#24443b" text-anchor="start">2 UE → 每 UE 4 Mbps</text><text x="65" y="314" font-size="21" fill="#24443b" text-anchor="start">4 UE → 总计 8 Mbps</text><rect x="340" y="289" width="140" height="37" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="410.0" y="313.5" font-size="18" fill="#24443b" text-anchor="middle">8 Mbps</text><text x="560" y="314" font-size="21" fill="#24443b" text-anchor="start">4 UE → 每 UE 2 Mbps</text><text x="65" y="371" font-size="21" fill="#24443b" text-anchor="start">8 UE → 总计 16 Mbps</text><rect x="340" y="346" width="140" height="37" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="410.0" y="370.5" font-size="18" fill="#24443b" text-anchor="middle">16 Mbps</text><text x="560" y="371" font-size="21" fill="#24443b" text-anchor="start">8 UE → 每 UE 1 Mbps</text><text x="35" y="440" font-size="16" fill="#24443b" text-anchor="start">等分总业务量是实验设定，不代表协议保证每 UE 得到相同吞吐。</text></g></svg>