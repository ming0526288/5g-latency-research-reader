<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 425" role="img" aria-labelledby="title desc">
<title id="title">算法得分以外，还需要哪些前置条件</title><desc id="desc">流程是研究实现的教学归纳，不是 3GPP 指定的唯一调度流程。 教学示意，不是新增实验结果。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d59"/></marker></defs>
<rect width="1000" height="425" rx="16" fill="#f5faf7"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif"><text x="35" y="48" font-size="29" fill="#24443b" text-anchor="start">算法得分以外，还需要哪些前置条件</text><text x="35" y="82" font-size="18" fill="#24443b" text-anchor="start">流程是研究实现的教学归纳，不是 3GPP 指定的唯一调度流程。</text><rect x="35" y="160" width="175" height="85" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="122.5" y="209.16666666666666" font-size="20" fill="#24443b" text-anchor="middle">业务到达</text><path d="M212 202 L227 202" stroke="#256d59" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="230" y="160" width="175" height="85" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="317.5" y="209.16666666666666" font-size="20" fill="#24443b" text-anchor="middle">队列与 HOL</text><path d="M407 202 L422 202" stroke="#256d59" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="425" y="160" width="175" height="85" rx="7" fill="#f6e7bf" stroke="#b8d1c2"/><text x="512.5" y="209.16666666666666" font-size="20" fill="#24443b" text-anchor="middle">资格/方向</text><path d="M602 202 L617 202" stroke="#256d59" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="620" y="160" width="175" height="85" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="707.5" y="209.16666666666666" font-size="20" fill="#24443b" text-anchor="middle">评分与资源</text><path d="M797 202 L812 202" stroke="#256d59" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="815" y="160" width="175" height="85" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="902.5" y="209.16666666666666" font-size="20" fill="#24443b" text-anchor="middle">交付与统计</text><text x="500" y="310" font-size="22" fill="#24443b" text-anchor="middle">比较算法前：先锁定相同业务、相同程序、相同资源及测量口径</text><text x="500" y="355" font-size="21" fill="#24443b" text-anchor="middle">3GPP 定义 QoS 特征与信令；实验算法及工程参数必须单独说明</text><text x="35" y="400" font-size="16" fill="#24443b" text-anchor="start">教学示意，不是新增实验结果。</text></g></svg>