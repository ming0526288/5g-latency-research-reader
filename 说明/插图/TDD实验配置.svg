<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 525" role="img" aria-labelledby="title desc">
<title id="title">从 RRC 配置读懂 D / F / U</title><desc id="desc">示例取自原实验配置；正常 CP、参考/数据 SCS 均 120 kHz、未配置 SBFD。 位置与符号顺序示意，不表示精确 CP 时长；此配比不是协议强制方案。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d59"/></marker></defs>
<rect width="1000" height="525" rx="16" fill="#f5faf7"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif"><text x="35" y="48" font-size="29" fill="#24443b" text-anchor="start">从 RRC 配置读懂 D / F / U</text><text x="35" y="82" font-size="18" fill="#24443b" text-anchor="start">示例取自原实验配置；正常 CP、参考/数据 SCS 均 120 kHz、未配置 SBFD。</text><rect x="65" y="135" width="168" height="70" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="149.0" y="177.33333333333334" font-size="22" fill="#24443b" text-anchor="middle">0: D</text><rect x="245" y="135" width="168" height="70" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="329.0" y="177.33333333333334" font-size="22" fill="#24443b" text-anchor="middle">1: D</text><rect x="425" y="135" width="168" height="70" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="509.0" y="177.33333333333334" font-size="22" fill="#24443b" text-anchor="middle">2: D</text><rect x="605" y="135" width="168" height="70" rx="7" fill="#f6e7bf" stroke="#b8d1c2"/><text x="689.0" y="177.33333333333334" font-size="22" fill="#24443b" text-anchor="middle">3: S</text><rect x="785" y="135" width="168" height="70" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="869.0" y="177.33333333333334" font-size="22" fill="#24443b" text-anchor="middle">4: U</text><text x="500" y="240" font-size="21" fill="#24443b" text-anchor="middle">一个配置周期：0.625 ms；5 个标称时隙；完整槽 D:U = 3:1</text><g id="tdd-symbols"><g data-direction="D"><rect x="65" y="295" width="56" height="55" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="93.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">D</text><text x="93" y="377" font-size="15" fill="#24443b" text-anchor="middle">0</text></g><g data-direction="D"><rect x="127" y="295" width="56" height="55" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="155.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">D</text><text x="155" y="377" font-size="15" fill="#24443b" text-anchor="middle">1</text></g><g data-direction="D"><rect x="189" y="295" width="56" height="55" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="217.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">D</text><text x="217" y="377" font-size="15" fill="#24443b" text-anchor="middle">2</text></g><g data-direction="D"><rect x="251" y="295" width="56" height="55" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="279.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">D</text><text x="279" y="377" font-size="15" fill="#24443b" text-anchor="middle">3</text></g><g data-direction="D"><rect x="313" y="295" width="56" height="55" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="341.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">D</text><text x="341" y="377" font-size="15" fill="#24443b" text-anchor="middle">4</text></g><g data-direction="D"><rect x="375" y="295" width="56" height="55" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="403.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">D</text><text x="403" y="377" font-size="15" fill="#24443b" text-anchor="middle">5</text></g><g data-direction="F"><rect x="437" y="295" width="56" height="55" rx="7" fill="#f6e7bf" stroke="#b8d1c2"/><text x="465.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">F</text><text x="465" y="377" font-size="15" fill="#24443b" text-anchor="middle">6</text></g><g data-direction="F"><rect x="499" y="295" width="56" height="55" rx="7" fill="#f6e7bf" stroke="#b8d1c2"/><text x="527.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">F</text><text x="527" y="377" font-size="15" fill="#24443b" text-anchor="middle">7</text></g><g data-direction="F"><rect x="561" y="295" width="56" height="55" rx="7" fill="#f6e7bf" stroke="#b8d1c2"/><text x="589.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">F</text><text x="589" y="377" font-size="15" fill="#24443b" text-anchor="middle">8</text></g><g data-direction="F"><rect x="623" y="295" width="56" height="55" rx="7" fill="#f6e7bf" stroke="#b8d1c2"/><text x="651.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">F</text><text x="651" y="377" font-size="15" fill="#24443b" text-anchor="middle">9</text></g><g data-direction="U"><rect x="685" y="295" width="56" height="55" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="713.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">U</text><text x="713" y="377" font-size="15" fill="#24443b" text-anchor="middle">10</text></g><g data-direction="U"><rect x="747" y="295" width="56" height="55" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="775.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">U</text><text x="775" y="377" font-size="15" fill="#24443b" text-anchor="middle">11</text></g><g data-direction="U"><rect x="809" y="295" width="56" height="55" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="837.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">U</text><text x="837" y="377" font-size="15" fill="#24443b" text-anchor="middle">12</text></g><g data-direction="U"><rect x="871" y="295" width="56" height="55" rx="7" fill="#dceee2" stroke="#b8d1c2"/><text x="899.0" y="329.1666666666667" font-size="20" fill="#24443b" text-anchor="middle">U</text><text x="899" y="377" font-size="15" fill="#24443b" text-anchor="middle">13</text></g></g><text x="65" y="420" font-size="21" fill="#24443b" text-anchor="start">S 展开：6 个 D + 4 个 F + 4 个 U；F 在此实验中留作保护。</text><text x="65" y="458" font-size="21" fill="#24443b" text-anchor="start">全周期按符号计数：D = 48，F = 4，U = 18，总计 70。</text><text x="35" y="500" font-size="16" fill="#24443b" text-anchor="start">位置与符号顺序示意，不表示精确 CP 时长；此配比不是协议强制方案。</text></g></svg>