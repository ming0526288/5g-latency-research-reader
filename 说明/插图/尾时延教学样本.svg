<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 505" role="img" aria-labelledby="title desc">
<title id="title">平均值相同的量纲，为什么还要看尾部</title><desc id="desc">分位数依赖样本数及计算方法；本例只演示计算，不估计真实违约概率。 五个样本不足以论证极端尾可靠性；报告必须保留采样、丢包与分位方法。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#256d59"/></marker></defs>
<rect width="1000" height="505" rx="16" fill="#f5faf7"/>
<g font-family="Arial, Noto Sans CJK SC, sans-serif"><text x="35" y="48" font-size="29" fill="#24443b" text-anchor="start">平均值相同的量纲，为什么还要看尾部</text><text x="35" y="82" font-size="18" fill="#24443b" text-anchor="start">分位数依赖样本数及计算方法；本例只演示计算，不估计真实违约概率。</text><text x="55" y="133" font-size="23" fill="#24443b" text-anchor="start">五个教学样本：1、2、3、4、10 ms（不是实验数据）</text><rect x="105" y="340" width="110" height="20" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="160" y="395" font-size="20" fill="#24443b" text-anchor="middle">1 ms</text><rect x="280" y="320" width="110" height="40" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="335" y="395" font-size="20" fill="#24443b" text-anchor="middle">2 ms</text><rect x="455" y="300" width="110" height="60" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="510" y="395" font-size="20" fill="#24443b" text-anchor="middle">3 ms</text><rect x="630" y="280" width="110" height="80" rx="7" fill="#dcebf7" stroke="#b8d1c2"/><text x="685" y="395" font-size="20" fill="#24443b" text-anchor="middle">4 ms</text><rect x="805" y="160" width="110" height="200" rx="7" fill="#f6e7bf" stroke="#b8d1c2"/><text x="860" y="395" font-size="20" fill="#24443b" text-anchor="middle">10 ms</text><text x="500" y="445" font-size="23" fill="#24443b" text-anchor="middle">线性插值 P99 = 9.76 ms；平均值 = 4 ms</text><text x="35" y="480" font-size="16" fill="#24443b" text-anchor="start">五个样本不足以论证极端尾可靠性；报告必须保留采样、丢包与分位方法。</text></g></svg>